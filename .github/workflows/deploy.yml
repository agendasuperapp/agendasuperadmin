name: 🌐 Build & Deploy (Web + APK Otimizado Paralelo)

on:
  push:
    branches:
      - flutterflow

jobs:
  # ============================================================
  # 1️⃣ BUILD & DEPLOY WEB
  # ============================================================
  deploy_web:
    name: 🌎 1️⃣ Deploy Web
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - name: agendasuper
            overlay: .github/overlays/agendasuper
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir: FTP_DIR_ADMIN

          - name: rendarecorrente
            overlay: .github/overlays/rendarecorrente
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir: FTP_DIR_AFI

    steps:
      - name: 1.1 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 1.2 ⚡ Restaurar cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: 1.3 🧰 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      - name: 1.4 ⚙️ Instalar utilitários do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq rsync curl lftp gzip

      - name: 1.5 🧠 Definir variáveis globais
        run: |
          case "${{ matrix.target.name }}" in
            "agendasuper")
              APPNAME="Agenda Super"
              IDAFILIADOAPP="1"
              SITE="app.agendasuper.com.br"
              ;;
            "rendarecorrente")
              APPNAME="APP Afiliado"
              IDAFILIADOAPP="3"
              SITE="painel.rendarecorrente.app"
              ;;
          esac
          echo "APPNAME=$APPNAME" >> $GITHUB_ENV
          echo "IDAFILIADOAPP=$IDAFILIADOAPP" >> $GITHUB_ENV
          echo "SITE=$SITE" >> $GITHUB_ENV

      - name: 1.6 ✏️ Atualizar nome no pubspec.yaml
        run: |
          SAFE_NAME=$(echo "${{ env.APPNAME }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | sed 's/[^a-z0-9_]//g')
          sed -i "s/^name:.*/name: ${SAFE_NAME}/" pubspec.yaml
          echo "✅ Nome atualizado: ${SAFE_NAME}"

      - name: 1.7 🧩 Build Web (otimizado)
        run: |
          flutter pub get
          flutter build web --release --dart2js-optimization=O4
          echo "✅ Build web concluído!"

      - name: 1.8 🗜️ Comprimir arquivos Web (gzip)
        run: |
          find build/web -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" \) -exec gzip -9 -k {} \;
          echo "✅ Arquivos web comprimidos com gzip."

      - name: 1.9 🧱 Aplicar overlay e personalização
        run: |
          mkdir -p temp/${{ matrix.target.name }}
          rsync -av --delete build/web/ temp/${{ matrix.target.name }}/
          rsync -av --exclude ".git" "${{ matrix.target.overlay }}/" "temp/${{ matrix.target.name }}/"
          TEMP_DIR="temp/${{ matrix.target.name }}"
          VERSION=$(jq -r '.version' "${TEMP_DIR}/version.json")
          sed -i "s/91234567890/${{ env.IDAFILIADOAPP }}/g" "${TEMP_DIR}/main.dart.js"
          sed -i "s/NomePageTitle/${{ env.APPNAME }}/g" "${TEMP_DIR}/main.dart.js"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 1.10 🚀 Publicar site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          protocol: ftp
          port: 21
          local-dir: temp/${{ matrix.target.name }}/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
          sync-mode: update
          timeout: 1200
          retries: 5

      - name: 1.11 💾 Registrar versão WEB no Supabase
        run: |
          DESC="${{ github.event.head_commit.message }}"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${{ env.VERSION }}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"OK\", \"sistema_op\": \"WEB\"}"

  # ============================================================
  # 2️⃣ BUILD & DEPLOY ANDROID
  # ============================================================
  deploy_apk:
    name: 🤖 2️⃣ Deploy APK
    runs-on: ubuntu-latest
    needs: deploy_web   # Roda em paralelo, mas garante que o web finalize primeiro

    strategy:
      matrix:
        target:
          - name: agendasuper
            app_id: com.adminagendasupertwo.app
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir: FTP_DIR_ADMIN
            afiliado: 1
            app_label: "Agenda Super"

          - name: rendarecorrente
            app_id: com.adminrendarecorrentetwo.app
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir: FTP_DIR_AFI
            afiliado: 3
            app_label: "APP Afiliado"

    steps:
      - name: 2.1 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 2.2 ⚡ Restaurar cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.yaml') }}

      - name: 2.3 🧰 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      - name: 2.4 ⚙️ Instalar utilitários Android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq rsync curl lftp zipalign apksigner

      - name: 2.5 🔐 Configurar Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=${{ github.workspace }}/android/app/upload-keystore.jks"
          } > android/key.properties

      - name: 2.6 🧠 Definir variáveis de ambiente
        run: |
          echo "APPNAME=${{ matrix.target.app_label }}" >> $GITHUB_ENV
          echo "APP_ID_ANDROID=${{ matrix.target.app_id }}" >> $GITHUB_ENV
          echo "IDAFILIADOAPP=${{ matrix.target.afiliado }}" >> $GITHUB_ENV

      - name: 2.7 ✏️ Personalizar app_state.dart e main.dart
        run: |
          perl -pi -e "s/91234567890/${{ env.IDAFILIADOAPP }}/g" lib/app_state.dart
          perl -pi -e "s/NomePageTitle/${{ env.APPNAME }}/g" lib/main.dart

      - name: 2.8 🧱 Substituir build.gradle modificado
        run: |
          cp -f .github/overlays/build/build.gradle android/app/build.gradle
          sed -i "s/applicationId \".*\"/applicationId \"${{ env.APP_ID_ANDROID }}\"/" android/app/build.gradle

      - name: 2.9 🧩 Aplicar overlays de ícones e códigos
        run: |
          mkdir -p lib/custom_code/actions
          cp -r .github/overlays/custom_codes/* lib/custom_code/actions/ || true
          ICON_PATH=".github/overlays/icons/${{ matrix.target.name }}/ic_launcher.png"
          for dir in android/app/src/main/res/mipmap-*; do
            cp "$ICON_PATH" "$dir/ic_launcher.png" || true
          done

      - name: 2.10 🤖 Gerar APK Release (otimizado)
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

          # 🔹 Alinhar e renomear APK
          zipalign -p 4 build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-aligned.apk

          # 🔹 Substitui espaços por "_" (compatível com bash)
          SAFE_APPNAME=$(echo "${{ matrix.target.app_label }}" | tr ' ' '_' )

          mv build/app/outputs/flutter-apk/app-aligned.apk "build/app/outputs/flutter-apk/${SAFE_APPNAME}_arm64.apk"
          echo "✅ APK otimizado gerado: ${SAFE_APPNAME}_arm64.apk"


      - name: 2.11 ☁️ Upload do APK via FTP
        run: |
          SAFE_APPNAME=$(echo "${{ env.APPNAME }}" | tr ' ' '_' )
          lftp -u "${{ secrets[ matrix.target.ftp_user ] }}","${{ secrets[ matrix.target.ftp_pass ] }}" "ftp://${{ secrets[ matrix.target.ftp_server ] }}" -e "
            set ftp:ssl-allow no;
            cd ${{ secrets[ matrix.target.ftp_dir ] }};
            mkdir -f apk || true;
            cd apk;
            lcd build/app/outputs/flutter-apk;
            put ${SAFE_APPNAME}_arm64.apk;
            bye
          "

      - name: 2.12 💾 Registrar versão APK no Supabase
        run: |
          DESC="${{ github.event.head_commit.message }}"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi
          SAFE_APPNAME=$(echo "${{ env.APPNAME }}" | tr ' ' '_' )
          VERSION="v$(date +%y.%m.%d.%H%M)"
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${VERSION}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"OK\", \"sistema_op\": \"APK\", \"nome_apk\": \"${SAFE_APPNAME}_${VERSION}_arm64.apk\"}"

      - name: 2.13 ✉️ Enviar e-mail de conclusão
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "✅ Deploy concluído ${{ matrix.target.name }}"
          to: "hersoares12@gmail.com, contatoagendasuper@gmail.com, gerenciavendasdigitais2@gmail.com"
          from: "Deploy Automático <${{ secrets.MAIL_USER }}> "
          body: |
            🌎 APP: **${{ env.APPNAME }}**
            📦 APK e Site publicados com sucesso.
            📅 Data: $(date '+%d/%m/%Y %H:%M:%S')
