name: 🌐 Build & Deploy (Web + APK Otimizado e Compatível)

on:
  push:
    branches:
      - flutterflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - name: agendasuper
            overlay: .github/overlays/agendasuper
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir: FTP_DIR_ADMIN

          - name: rendarecorrente
            overlay: .github/overlays/rendarecorrente
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir: FTP_DIR_AFI

    steps:
      # 1️⃣ Clonar repositório
      - name: 1️⃣ 📥 Clonar repositório
        uses: actions/checkout@v4

      # 2️⃣ Restaurar cache Flutter e Gradle
      - name: 2️⃣ ⚡ Restaurar cache Flutter e Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            build
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # 3️⃣ Instalar Flutter
      - name: 3️⃣ 🧰 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      # 4️⃣ Instalar utilitários necessários
      - name: 4️⃣ ⚙️ Instalar utilitários necessários
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync curl lftp zipalign apksigner

      # 5️⃣ Preparar ambiente
      - name: 5️⃣ 🧹 Preparar ambiente
        run: |
          flutter pub get
          mkdir -p temp/${{ matrix.target.name }}

      # 6️⃣ Definir variáveis globais
      - name: 6️⃣ 🧠 Definir variáveis globais
        run: |
          case "${{ matrix.target.name }}" in
            "agendasuper")
              APPNAME="Agenda Super"
              IDAFILIADOAPP="1"
              SITE="app.agendasuper.com.br"
              APP_ID_ANDROID="com.adminagendasupertwo.app"
              ;;
            "rendarecorrente")
              APPNAME="APP Afiliado"
              IDAFILIADOAPP="3"
              SITE="painel.rendarecorrente.app"
              APP_ID_ANDROID="com.adminrendarecorrentetwo.app"
              ;;
          esac
          echo "APPNAME=$APPNAME" >> $GITHUB_ENV
          echo "IDAFILIADOAPP=$IDAFILIADOAPP" >> $GITHUB_ENV
          echo "SITE=$SITE" >> $GITHUB_ENV
          echo "APP_ID_ANDROID=$APP_ID_ANDROID" >> $GITHUB_ENV

      # 7️⃣ Personalizar app_state.dart
      - name: 7️⃣ ✏️ Personalizar lib/app_state.dart
        run: |
          cp lib/app_state.dart lib/app_state_backup.dart || true
          perl -pi -e "s/91234567890/${{ env.IDAFILIADOAPP }}/g" lib/app_state.dart

      # 8️⃣ Personalizar main.dart
      - name: 8️⃣ ✏️ Personalizar lib/main.dart
        run: |
          perl -pi -e "s/NomePageTitle/${{ env.APPNAME }}/g" lib/main.dart

      # 9️⃣ Build Web (release)
      - name: 9️⃣ 🏗️ Build Web (release)
        run: flutter build web --release

      # 🔟 Aplicar overlay (web)
      - name: 🔟 🧩 Aplicar overlay personalizado (web)
        run: |
          rsync -av --delete build/web/ temp/${{ matrix.target.name }}/
          rsync -av --exclude ".git" "${{ matrix.target.overlay }}/" "temp/${{ matrix.target.name }}/"

      # 11️⃣ Personalizar main.dart.js e index.html
      - name: 11️⃣ 🧠 Personalizar main.dart.js e index.html
        run: |
          TEMP_DIR="temp/${{ matrix.target.name }}"
          VERSION=$(jq -r '.version' "${TEMP_DIR}/version.json" || echo "4.1.0")
          sed -i "s/NomePageTitle/${{ env.APPNAME }}/g" "${TEMP_DIR}/main.dart.js"
          sed -i "s/91234567890/${{ env.IDAFILIADOAPP }}/g" "${TEMP_DIR}/main.dart.js"
          sed -i "s/const appVersion = \".*\";/const appVersion = \"${VERSION}\";/g" "${TEMP_DIR}/index.html"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # 12️⃣ Publicar site via FTP
      - name: 12️⃣ 🚀 Publicar site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          protocol: ftp
          port: 21
          timeout: 1200
          retries: 5
          local-dir: temp/${{ matrix.target.name }}/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
          dangerous-clean-slate: false
          sync-mode: update

      # 13️⃣ Registrar versão WEB no Supabase
      - name: 13️⃣ 💾 Registrar versão WEB no Supabase
        run: |
          DESC="${{ github.event.head_commit.message }}"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${{ env.VERSION }}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"OK\", \"sistema_op\": \"WEB\"}"

      # 14️⃣ Configurar assinatura Android
      - name: 14️⃣ 🔐 Configurar assinatura Android
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=${{ github.workspace }}/android/app/upload-keystore.jks"
          } > android/key.properties

      # 15️⃣ Aplicar custom codes overlay
      - name: 15️⃣ 🔄 Aplicar custom codes overlay
        run: |
          mkdir -p lib/custom_code/actions
          cp -r .github/overlays/custom_codes/* lib/custom_code/actions/

      # 16️⃣ Personalizar ícones e IDs
      - name: 16️⃣ 🎨 Aplicar ícones e IDs corretos
        run: |
          sed -i "s/^namespace .*/namespace \"${{ env.APP_ID_ANDROID }}\"/" android/app/build.gradle
          sed -i "s/applicationId \".*\"/applicationId \"${{ env.APP_ID_ANDROID }}\"/" android/app/build.gradle
          ICON_PATH=".github/overlays/icons/${{ matrix.target.name }}/ic_launcher.png"
          for dir in android/app/src/main/res/mipmap-*; do
            cp "$ICON_PATH" "$dir/ic_launcher.png" || true
          done

      # 17️⃣ Corrigir nome no Manifest
      - name: 17️⃣ 📝 Corrigir nome no AndroidManifest.xml
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${{ env.APPNAME }}\"/" "$MANIFEST_PATH"

      # 18️⃣ Substituir build.gradle customizado
      - name: 18️⃣ 🧱 Substituir build.gradle customizado
        run: |
          cp -f .github/overlays/build/build.gradle android/app/build.gradle
          grep "applicationId" android/app/build.gradle

      # 19️⃣ Gerar APK Release
      - name: 19️⃣ 🤖 Gerar APK Release Assinado
        run: |
          flutter build apk --release --target-platform android-arm64
          VERSION=${{ env.VERSION }}
          SAFE_APPNAME=$(echo "${{ env.APPNAME }}" | tr ' ' '_' )
          APK_PATH="build/app/outputs/flutter-apk/${SAFE_APPNAME}_${VERSION}_arm64.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      # 20️⃣ Upload do APK via FTP
      - name: 20️⃣ ☁️ Enviar APK para Hostinger
        run: |
          VERSION=${{ env.VERSION }}
          SAFE_APPNAME=$(echo "${{ env.APPNAME }}" | tr ' ' '_' )
          lftp -u "${{ secrets[ matrix.target.ftp_user ] }}","${{ secrets[ matrix.target.ftp_pass ] }}" "ftp://${{ secrets[ matrix.target.ftp_server ] }}" -e "
            set ftp:ssl-allow no;
            cd ${{ secrets[ matrix.target.ftp_dir ] }};
            mkdir -f apk || true;
            cd apk;
            lcd build/app/outputs/flutter-apk;
            put ${SAFE_APPNAME}_${VERSION}_arm64.apk;
            bye
          "

      # 21️⃣ Registrar versão APK no Supabase
      - name: 21️⃣ 💾 Registrar versão APK no Supabase
        run: |
          DESC="${{ github.event.head_commit.message }}"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi
          SAFE_APPNAME=$(echo "${{ env.APPNAME }}" | tr ' ' '_' )
          VERSION=${{ env.VERSION }}
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${VERSION}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"OK\", \"sistema_op\": \"APK\", \"nome_apk\": \"${SAFE_APPNAME}_${VERSION}_arm64.apk\"}"

      # 22️⃣ Enviar e-mail de conclusão
      - name: 22️⃣ ✉️ Enviar e-mail de conclusão
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🚀 Deploy concluído ${{ matrix.target.name }} v${{ env.VERSION }}"
          to: "hersoares12@gmail.com, contatoagendasuper@gmail.com, gerenciavendasdigitais2@gmail.com"
          from: "Deploy Automático <${{ secrets.MAIL_USER }}>"
          body: |
            ✅ Deploy concluído para **${{ matrix.target.name }}**
            🌐 Versão: **${{ env.VERSION }}**
            📦 App: **${{ env.APPNAME }}**
            🌎 Site: **${{ env.SITE }}**
            📅 Data: $(date '+%d/%m/%Y %H:%M:%S')
