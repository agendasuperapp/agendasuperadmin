name: 🌐 Build & Deploy (Web + APK)

on:
  push:
    branches:
      - flutterflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - name: agendasuper
            overlay: .github/overlays/agendasuper
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir: FTP_DIR_ADMIN

          - name: rendarecorrente
            overlay: .github/overlays/rendarecorrente
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir: FTP_DIR_AFI

    steps:
      # 1️⃣ Clonar código
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      # 2️⃣ Instalar Flutter
      - name: 🧰 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      # 3️⃣ Instalar utilitários
      - name: ⚙️ Instalar utilitários necessários
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync curl lftp

      # 4️⃣ Preparar ambiente
      - name: 🧹 Limpar e preparar ambiente
        run: |
          flutter clean
          flutter pub get
          mkdir -p temp/${{ matrix.target.name }}

      # 5️⃣ Definir variáveis globais
      - name: 🧠 Definir variáveis globais
        run: |
          case "${{ matrix.target.name }}" in
            "agendasuper")
              APPNAME="Agenda Super"
              IDAFILIADOAPP="1"
              SITE="app.agendasuper.com.br"
              APP_ID_ANDROID="com.adminagendasuper.app"
              ;;
            "rendarecorrente")
              APPNAME="APP Afiliado"
              IDAFILIADOAPP="3"
              SITE="painel.rendarecorrente.app"
              APP_ID_ANDROID="com.adminrendarecorrente.app"
              ;;
          esac
          echo "APPNAME=$APPNAME" >> $GITHUB_ENV
          echo "IDAFILIADOAPP=$IDAFILIADOAPP" >> $GITHUB_ENV
          echo "SITE=$SITE" >> $GITHUB_ENV
          echo "APP_ID_ANDROID=$APP_ID_ANDROID" >> $GITHUB_ENV

      # 6️⃣ Substituir ID no lib/app_state.dart
      - name: ✏️ Personalizar lib/app_state.dart
        run: |
          cp lib/app_state.dart lib/app_state_backup.dart || true
          perl -pi -e "s/91234567890/${{ env.IDAFILIADOAPP }}/g" lib/app_state.dart

      # 7️⃣ Substituir NomePageTitle no lib/main.dart
      - name: ✏️ Personalizar lib/main.dart
        run: |
          perl -pi -e "s/NomePageTitle/${{ env.APPNAME }}/g" lib/main.dart

      # 8️⃣ Build Web (release)
      - name: 🏗️ Build Web (modo release)
        run: |
          echo "🚀 Iniciando build web..."
          flutter build web --release

      # 9️⃣ Aplicar overlay web
      - name: 🧩 Aplicar overlay personalizado (web)
        run: |
          rsync -av --delete build/web/ temp/${{ matrix.target.name }}/
          rsync -av --exclude ".git" "${{ matrix.target.overlay }}/" "temp/${{ matrix.target.name }}/"

      # 🔟 Personalizar arquivos do Web Build
      - name: 🧠 Personalizar main.dart.js e index.html
        run: |
          TEMP_DIR="temp/${{ matrix.target.name }}"
          VERSION=$(jq -r '.version' "${TEMP_DIR}/version.json")
          echo "📦 Versão detectada: $VERSION"
          sed -i "s/NomePageTitle/${{ env.APPNAME }}/g" "${TEMP_DIR}/main.dart.js"
          sed -i "s/91234567890/${{ env.IDAFILIADOAPP }}/g" "${TEMP_DIR}/main.dart.js"
          sed -i "s/const appVersion = \".*\";/const appVersion = \"${VERSION}\";/g" "${TEMP_DIR}/index.html"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # 1️⃣1️⃣ Publicar via FTP (Web)
      - name: 🚀 Publicar site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          protocol: ftp
          port: 21
          timeout: 1200
          retries: 5
          local-dir: temp/${{ matrix.target.name }}/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
          dangerous-clean-slate: false
          sync-mode: update
          log-level: verbose

      # 1️⃣2️⃣ Registrar versão no Supabase (WEB)
      - name: 💾 Registrar versão WEB no Supabase
        run: |
          DESC="${{ github.event.head_commit.message }}"
          STATUS="${{ job.status }}"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${{ env.VERSION }}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"${STATUS}\", \"sistema_op\": \"WEB\"}"

      # 1️⃣3️⃣ Configurar assinatura do APK (keystore)
      - name: 🔐 Configurar assinatura Android (keystore)
        run: |
          set -e
          echo "🔐 Gerando key.properties e configurando assinatura..."
          KEYSTORE_B64="${{ secrets.ANDROID_KEYSTORE_B64 }}"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          echo "storePassword=$STORE_PASS" > android/key.properties
          echo "keyPassword=$KEY_PASS" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          echo "✅ key.properties criado com sucesso"
          if ! grep -q "key.properties" android/app/build.gradle; then
            echo "🧩 Adicionando configuração de assinatura ao build.gradle..."
            {
              echo ""
              echo "def keystoreProperties = new Properties()"
              echo "def keystorePropertiesFile = rootProject.file(\"android/key.properties\")"
              echo "if (keystorePropertiesFile.exists()) {"
              echo "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))"
              echo "}"
              echo ""
              echo "android {"
              echo "    signingConfigs {"
              echo "        release {"
              echo "            if (keystorePropertiesFile.exists()) {"
              echo "                storeFile file(keystoreProperties['storeFile'])"
              echo "                storePassword keystoreProperties['storePassword']"
              echo "                keyAlias keystoreProperties['keyAlias']"
              echo "                keyPassword keystoreProperties['keyPassword']"
              echo "            }"
              echo "        }"
              echo "    }"
              echo "    buildTypes {"
              echo "        release {"
              echo "            signingConfig signingConfigs.release"
              echo "        }"
              echo "    }"
              echo "}"
            } >> android/app/build.gradle
          fi

      # 1️⃣4️⃣ Ajustar applicationId
      - name: 🧱 Ajustar applicationId
        run: |
          sed -i "s/applicationId \".*\"/applicationId \"${{ env.APP_ID_ANDROID }}\"/" android/app/build.gradle

      # 1️⃣5️⃣ Build APK (release)
      - name: 🤖 Gerar APK Android (modo release)
        run: |
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/

      # 1️⃣6️⃣ Enviar APK para hospedagem
      - name: ☁️ Enviar APK para Hostinger
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          APK_REMOTE_PATH="apk/${{ matrix.target.name }}_${{ env.VERSION }}.apk"
          lftp -u "${{ secrets[ matrix.target.ftp_user ] }}","${{ secrets[ matrix.target.ftp_pass ] }}" "ftp://${{ secrets[ matrix.target.ftp_server ] }}" -e "
            set ftp:ssl-allow no;
            mkdir -p ${{ secrets[ matrix.target.ftp_dir ] }}/apk;
            put ${APK_FILE} -o ${{ secrets[ matrix.target.ftp_dir ] }}/${APK_REMOTE_PATH};
            bye
          "

      # 1️⃣7️⃣ Registrar versão no Supabase (APK)
      - name: 💾 Registrar versão APK no Supabase
        run: |
          DESC="${{ github.event.head_commit.message }}"
          STATUS="${{ job.status }}"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${{ env.VERSION }}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"${STATUS}\", \"sistema_op\": \"APK\"}"

      # 1️⃣8️⃣ Enviar e-mail final de conclusão
      - name: ✉️ Enviar e-mail de conclusão
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🚀 Deploy concluído ${{ matrix.target.name }} v${{ env.VERSION }}"
          to: "hersoares12@gmail.com, contatoagendasuper@gmail.com, gerenciavendasdigitais2@gmail.com"
          from: "Deploy Automático <${{ secrets.MAIL_USER }}>"
          body: |
            ✅ Deploy concluído para APP ${{ matrix.target.name }}
            🌐 Versão: ${{ env.VERSION }}
            📅 Data: $(date '+%d/%m/%Y %H:%M:%S')
            🔧 Status: ${{ job.status }}
            🌎 Site: ${{ env.SITE }}
            📦 Aplicativo: ${{ env.APPNAME }}
