# 🌐 Build & Deploy (2 Sites)
name: 🌐 Build & Deploy (2 Sites)

on:
  push:
    branches:
      - flutterflow   # ajuste se o FlutterFlow usar outra branch (ex: main)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona o repositório
      - name: 📥 Clonar código do repositório
        uses: actions/checkout@v4

      # 2️⃣ Instala o Flutter (versão atual estável compatível com FlutterFlow)
      - name: 🧰 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      # 3️⃣ Limpa cache e instala dependências
      - name: 🧹 Preparar ambiente Flutter limpo
        run: |
          flutter clean
          flutter pub get
          flutter --version
          dart --version

      # 4️⃣ Faz o build web (modo release)
      - name: 🏗️ Build Web (modo release)
        run: |
          echo "🚀 Iniciando build web..."
          flutter build web --release

      # 5️⃣ Exibe informações do build (diagnóstico)
      - name: 🔎 Verificar arquivos gerados
        run: |
          echo "📁 Conteúdo da pasta build/web:"
          ls -lh build/web/ | head -20
          echo "📦 Tamanho do main.dart.js:"
          du -h build/web/main.dart.js || true

      # 6️⃣ Armazena o build como artifact para o job de deploy
      - name: 📦 Armazenar build como artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - name: agendasuper
            overlay: .github/overlays/agendasuper
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir:  FTP_DIR_ADMIN

          - name: rendarecorrente
            overlay: .github/overlays/rendarecorrente
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir:  FTP_DIR_AFI

    steps:
      # 7️⃣ Baixa o código e o build gerado
      - name: 📥 Baixar código e build
        uses: actions/checkout@v4

      # 8️⃣ Baixa o artifact do build web
      - name: 📦 Baixar build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      # 9️⃣ Instala utilitários necessários (jq, rsync, curl, lftp)
      - name: ⚙️ Instalar utilitários necessários
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync curl lftp
          mkdir -p temp/${{ matrix.target.name }}

      # 🌍 Definir variáveis globais para o app (APPNAME, IDAFILIADOAPP, SITE)
      - name: ⚙️ Definir variáveis globais
        run: |
          case "${{ matrix.target.name }}" in
            "agendasuper")
              echo "APPNAME=Agenda Super" >> $GITHUB_ENV
              echo "IDAFILIADOAPP=1" >> $GITHUB_ENV
              echo "SITE=app.agendasuper.com.br" >> $GITHUB_ENV
              echo "APP_ID_ANDROID=com.adminagendasuper.app" >> $GITHUB_ENV
              ;;
            "rendarecorrente")
              echo "APPNAME=APP Afiliado" >> $GITHUB_ENV
              echo "IDAFILIADOAPP=3" >> $GITHUB_ENV
              echo "SITE=painel.rendarecorrente.app" >> $GITHUB_ENV
              echo "APP_ID_ANDROID=com.adminrendarecorrente.app" >> $GITHUB_ENV
              ;;
          esac
          echo "✅ Variáveis globais definidas:"
          echo "APPNAME=${{ env.APPNAME }} | IDAFILIADOAPP=${{ env.IDAFILIADOAPP }} | SITE=${{ env.SITE }} | APP_ID_ANDROID=${{ env.APP_ID_ANDROID }}"

      # 🧠 Personalizar lib/main.dart com o título do app (antes de qualquer build)
      - name: 🧠 Atualizar lib/main.dart com nome do app
        run: |
          echo "✏️ Substituindo NomePageTitle por '${{ env.APPNAME }}'..."
          cp lib/main.dart lib/main_backup.dart || true
          perl -pi -e "s/NomePageTitle/${{ env.APPNAME }}/g" lib/main.dart
          echo "✅ lib/main.dart atualizado!"

      # 🧠 Personalizar lib/app_state.dart com ID (antes do build web/apk)
      - name: 🧠 Personalizar lib/app_state.dart (antes do build web/apk)
        run: |
          echo "⚙️ Substituindo 91234567890 por '${{ env.IDAFILIADOAPP }}' em lib/app_state.dart..."
          cp lib/app_state.dart lib/app_state_backup.dart || true
          perl -pi -e "s/91234567890/${{ env.IDAFILIADOAPP }}/g" lib/app_state.dart
          echo "✅ Substituição concluída:"
          grep -m 1 "_varIDAPPAfiliado" lib/app_state.dart || true

      # 🔟 Copia build base e aplica overlay personalizado
      - name: 🧩 Aplicar overlay personalizado
        run: |
          echo "📦 Copiando build web base..."
          rsync -av --delete web-build/ temp/${{ matrix.target.name }}/
          echo "🧩 Aplicando overlay de ${{ matrix.target.name }}..."
          rsync -av --exclude ".git" "${{ matrix.target.overlay }}/" "temp/${{ matrix.target.name }}/"

      # 1️⃣1️⃣ Personaliza arquivos do bundle web e gera log de versão
      - name: 🧠 Personalizar arquivos e gerar log de versão (WEB)
        run: |
          TEMP_DIR="temp/${{ matrix.target.name }}"
          VERSION=$(jq -r '.version' "${TEMP_DIR}/version.json")
          echo "📦 Versão detectada: $VERSION"

          # atualiza título e ID no JS, além da versão no index.html
          sed -i "s/NomePageTitle/${{ env.APPNAME }}/g" "${TEMP_DIR}/main.dart.js"
          sed -i "s/91234567890/${{ env.IDAFILIADOAPP }}/g" "${TEMP_DIR}/main.dart.js"
          sed -i "s/const appVersion = \".*\";/const appVersion = \"${VERSION}\";/g" "${TEMP_DIR}/index.html"

          BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S')
          LOG_FILE="${TEMP_DIR}/${{ env.SITE }}_${VERSION}.txt"
          echo "Versão: ${VERSION}" > "${LOG_FILE}"
          echo "Data: ${BUILD_DATE}" >> "${LOG_FILE}"
          echo "📄 Criado ${LOG_FILE}"

          # Exporta SITE para uso em e-mail
          echo "SITE=${{ env.SITE }}" >> $GITHUB_ENV

      # 1️⃣2️⃣ Criar backup remoto dentro da hospedagem (versão atual)
      - name: 💾 Criar backup remoto com versão atual (WEB)
        run: |
          set -e
          FTP_HOST="${{ secrets[ matrix.target.ftp_server ] }}"
          FTP_USER="${{ secrets[ matrix.target.ftp_user ] }}"
          FTP_PASS="${{ secrets[ matrix.target.ftp_pass ] }}"
          REMOTE_DIR="${{ secrets[ matrix.target.ftp_dir ] }}"

          # Baixa o version.json remoto
          curl -s -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$REMOTE_DIR/version.json" -o version_remote.json || echo "{}" > version_remote.json
          VERSION_REMOTE=$(jq -r '.version // "desconhecida"' version_remote.json)
          echo "📦 Versão detectada no servidor: ${VERSION_REMOTE}"

          TIMESTAMP=$(date '+%Y_%m_%d_%H%M%S')
          BACKUP_DIR="backup_versao_${VERSION_REMOTE}_${TIMESTAMP}"
          echo "📁 Pasta de backup: ${BACKUP_DIR}"

          # espelha public_html para uma pasta backup/...
          rm -rf local_backup && mkdir -p local_backup
          lftp -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST" -e "
            set ftp:ssl-allow no;
            mirror --verbose --exclude-glob backup/ ${REMOTE_DIR}/ ./local_backup/;
            bye
          "
          lftp -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST" -e "
            set ftp:ssl-allow no;
            mkdir -p ${REMOTE_DIR}/backup/${BACKUP_DIR};
            mirror --reverse --verbose ./local_backup/ ${REMOTE_DIR}/backup/${BACKUP_DIR}/;
            bye
          "
          echo "✅ Backup WEB criado em ${REMOTE_DIR}/backup/${BACKUP_DIR}"

      # 1️⃣3️⃣ Publicar via FTP (Hostinger) – SEM apagar tudo
      - name: 🚀 Publicar via FTP (Hostinger)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          protocol: ftp
          port: 21
          timeout: 1200
          retries: 5
          local-dir: temp/${{ matrix.target.name }}/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
          dangerous-clean-slate: false
          sync-mode: update
          log-level: verbose

      # 1️⃣4️⃣ Registra versão WEB no Supabase
      - name: 💾 Registrar versão WEB no Supabase
        if: success() || failure()
        run: |
          TEMP_DIR="temp/${{ matrix.target.name }}"
          VERSION=$(jq -r '.version' "${TEMP_DIR}/version.json")
          DESC="${{ github.event.head_commit.message }}"
          STATUS="${{ job.status }}"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi

          echo "🌐 Registrando versão WEB no Supabase..."
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${VERSION}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"${STATUS}\", \"sistema_op\": \"WEB\"}"

      # 1️⃣5️⃣ Captura informações para o e-mail (WEB concluído)
      - name: 📨 Preparar informações para e-mail (WEB)
        if: success() || failure()
        run: |
          TEMP_DIR="temp/${{ matrix.target.name }}"
          VERSION=$(jq -r '.version' "${TEMP_DIR}/version.json")
          DATA=$(date '+%d/%m/%Y %H:%M:%S')
          STATUS="${{ job.status }}"
          DESC="${{ github.event.head_commit.message }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "DATA=${DATA}" >> $GITHUB_ENV
          echo "STATUS=${STATUS}" >> $GITHUB_ENV
          echo "DESC=${DESC}" >> $GITHUB_ENV

      # 1️⃣6️⃣ Enviar e-mail de notificação (status do WEB)
      - name: ✉️ Disparar e-mail de status do deploy (WEB)
        if: success() || failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🚀 Atualização WEB ${{ matrix.target.name }} ${{ env.STATUS }}"
          to: "hersoares12@gmail.com, contatoagendasuper@gmail.com, gerenciavendasdigitais2@gmail.com"
          from: "APP ${{ matrix.target.name }} ${{ env.VERSION }} ${{ env.STATUS }} (WEB) <${{ secrets.MAIL_USER }}>"
          body: |
            ✅ Deploy WEB finalizado para ${{ matrix.target.name }}
            🌐 Versão: ${{ env.VERSION }}
            📝 Descrição: ${{ env.DESC }}
            📅 Data: ${{ env.DATA }}
            🌎 Site: ${{ env.SITE }}
            ⚙️ Status: ${{ env.STATUS }}

      # 1️⃣7️⃣ ——— A partir daqui: fluxo do APK ———

      # 1️⃣7️⃣-A Fazer backup dos arquivos originais (antes do custom_code)
      - name: 🗂️ Backup dos arquivos originais (APK)
        run: |
          mkdir -p backup_original_actions
          cp -r lib/custom_code/actions/* backup_original_actions/ || true

      # 1️⃣7️⃣-B Aplicar custom_codes para build Android
      - name: 🔁 Aplicar custom_codes (APK)
        run: |
          rsync -av --exclude ".git" ".github/overlays/custom_codes/" "lib/custom_code/actions/"

      # 1️⃣7️⃣-C Personalizar nome, ícones e imagens do APK
      - name: 🧠 Personalizar nome, ícones e imagens (APK)
        run: |
          case "${{ matrix.target.name }}" in
            "agendasuper")
              ICON_PATH=".github/overlays/icons/agendasuper"
              ASSETS_PATH=".github/overlays/icons/agendasuper/assets_images"
              ;;
            "rendarecorrente")
              ICON_PATH=".github/overlays/icons/rendarecorrente"
              ASSETS_PATH=".github/overlays/icons/rendarecorrente/assets_images"
              ;;
          esac

          # Nome no AndroidManifest
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${{ env.APPNAME }}\"/" android/app/src/main/AndroidManifest.xml

          # Ícones
          for size in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$size
            if [ -f "${ICON_PATH}/ic_launcher.png" ]; then
              cp -f "${ICON_PATH}/ic_launcher.png" android/app/src/main/res/$size/ic_launcher.png
            fi
          done

          # Assets (inclui appsplashimage.png)
          if [ -d "${ASSETS_PATH}" ]; then
            rsync -av --exclude ".git" "${ASSETS_PATH}/" "assets/images/"
          fi

      # 1️⃣7️⃣-D Ajustar applicationId único
      - name: 🧱 Ajustar applicationId
        run: |
          sed -i "s/applicationId \".*\"/applicationId \"${{ env.APP_ID_ANDROID }}\"/" android/app/build.gradle
          echo "✅ applicationId = ${{ env.APP_ID_ANDROID }}"

      # 1️⃣7️⃣-E (OPCIONAL, mas recomendado) Restaurar keystore e configurar assinatura release
      - name: 🔑 Restaurar keystore e configurar assinatura (release)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          # Reconstrói o arquivo JKS a partir do Base64
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

          # Cria key.properties
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=android/app/upload-keystore.jks
          EOF

          # Garante que o build.gradle leia o key.properties e use signingConfigs.release
          if ! grep -q "def keystoreProperties" android/app/build.gradle; then
            cat <<'GRAD' >> android/app/build.gradle

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("android/key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
GRAD
          else
            # Força a usar signingConfigs.release no release
            sed -i 's/buildTypes {[^}]*release {[^}]*}/buildTypes { release { signingConfig signingConfigs.release } }/g' android/app/build.gradle || true
          fi

      # 1️⃣7️⃣-F Instalar Flutter (caso precise reconfig para build Android)
      - name: 🧰 Garantir Flutter para gerar APK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      # 1️⃣7️⃣-G Gerar o APK Android (release)
      - name: 🤖 Gerar APK Android (release)
        run: |
          echo "📱 Iniciando build APK..."
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/

      # 1️⃣7️⃣-H Restaurar arquivos originais após gerar o APK
      - name: 🔙 Restaurar arquivos originais (custom_code)
        run: |
          rm -rf lib/custom_code/actions/*
          cp -r backup_original_actions/* lib/custom_code/actions/ || true

      # 1️⃣7️⃣-I Enviar o APK para a hospedagem Hostinger
      - name: ☁️ Enviar APK para Hostinger
        run: |
          VERSION=$(jq -r '.version' "temp/${{ matrix.target.name }}/version.json")
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          APK_REMOTE_PATH="apk/${{ matrix.target.name }}_${VERSION}.apk"
          lftp -u "${{ secrets[ matrix.target.ftp_user ] }}","${{ secrets[ matrix.target.ftp_pass ] }}" "ftp://${{ secrets[ matrix.target.ftp_server ] }}" -e "
            set ftp:ssl-allow no;
            mkdir -p ${{ secrets[ matrix.target.ftp_dir ] }}/apk;
            put ${APK_FILE} -o ${{ secrets[ matrix.target.ftp_dir ] }}/${APK_REMOTE_PATH};
            bye
          "
          echo "✅ APK enviado para /public_html/${APK_REMOTE_PATH}"

      # 1️⃣7️⃣-J Registrar versão APK no Supabase
      - name: 💾 Registrar versão APK no Supabase
        if: success() || failure()
        run: |
          VERSION=$(jq -r '.version' "temp/${{ matrix.target.name }}/version.json")
          DESC="${{ github.event.head_commit.message }}"
          STATUS="${{ job.status }}"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi

          echo "📱 Registrando versão APK no Supabase..."
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${VERSION}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"${STATUS}\", \"sistema_op\": \"APK\"}"

      # 1️⃣7️⃣-K E-mail de status (APK)
      - name: ✉️ Disparar e-mail de status do APK
        if: success() || failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "📱 Atualização APK ${{ matrix.target.name }} ${{ env.STATUS }}"
          to: "hersoares12@gmail.com, contatoagendasuper@gmail.com, gerenciavendasdigitais2@gmail.com"
          from: "APP ${{ matrix.target.name }} ${{ env.VERSION }} ${{ env.STATUS }} (APK) <${{ secrets.MAIL_USER }}>"
          body: |
            ✅ APK finalizado para ${{ matrix.target.name }}
            🌐 Versão: ${{ env.VERSION }}
            📝 Descrição: ${{ env.DESC }}
            📅 Data: ${{ env.DATA }}
            🌎 Site: ${{ env.SITE }}
            ⚙️ Status: ${{ env.STATUS }}

      # 1️⃣8️⃣ Finaliza e mostra status
      - name: ✅ Finalização do job
        run: echo "🎉 WEB + APK concluídos para ${{ matrix.target.name }}!"
