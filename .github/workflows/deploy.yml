# 🌐 Build & Deploy (2 Sites)
name: 🌐 Build & Deploy (2 Sites)

on:
  push:
    branches:
      - flutterflow   # ajuste se o FlutterFlow usar outra branch (ex: main)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona o repositório
      - name: 📥 Clonar código do repositório
        uses: actions/checkout@v4

      # 2️⃣ Instala o Flutter (versão atual estável compatível com FlutterFlow)
      - name: 🧰 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      # 3️⃣ Limpa cache e instala dependências
      - name: 🧹 Preparar ambiente Flutter limpo
        run: |
          flutter clean
          flutter pub get
          flutter --version
          dart --version

      # 4️⃣ Faz o build web (modo release)
      - name: 🏗️ Build Web (modo release)
        run: |
          echo "🚀 Iniciando build web..."
          flutter build web --release 

      # 5️⃣ Exibe informações do build (diagnóstico)
      - name: 🔎 Verificar arquivos gerados
        run: |
          echo "📁 Conteúdo da pasta build/web:"
          ls -lh build/web/ | head -20
          echo "📦 Tamanho do main.dart.js:"
          du -h build/web/main.dart.js || true

      # 6️⃣ Armazena o build como artifact para o job de deploy
      - name: 📦 Armazenar build como artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - name: agendasuper
            overlay: .github/overlays/agendasuper
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir:  FTP_DIR_ADMIN

          - name: rendarecorrente
            overlay: .github/overlays/rendarecorrente
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir:  FTP_DIR_AFI

    steps:
      # 7️⃣ Baixa o código e o build gerado
      - name: 📥 Baixar código e build
        uses: actions/checkout@v4

      # 8️⃣ Baixa o artifact do build web
      - name: 📦 Baixar build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      # 9️⃣ Instala utilitários necessários (jq, rsync, curl, lftp)
      - name: ⚙️ Instalar utilitários necessários
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync curl lftp
          mkdir -p temp/${{ matrix.target.name }}

      # 🔟 Copia build base e aplica overlay personalizado
      - name: 🧩 Aplicar overlay personalizado
        run: |
          echo "📦 Copiando build web base..."
          rsync -av --delete web-build/ temp/${{ matrix.target.name }}/
          echo "🧩 Aplicando overlay de ${{ matrix.target.name }}..."
          rsync -av --exclude ".git" "${{ matrix.target.overlay }}/" "temp/${{ matrix.target.name }}/"

      # 1️⃣1️⃣ Personaliza arquivos e gera log de versão
      - name: 🧠 Personalizar arquivos e gerar log de versão
        run: |
          TEMP_DIR="temp/${{ matrix.target.name }}"
          VERSION=$(jq -r '.version' "${TEMP_DIR}/version.json")
          echo "📦 Versão detectada: $VERSION"

          case "${{ matrix.target.name }}" in
            "agendasuper")
              APPNAME="Agenda Super"
              IDAFILIADOAPP="1"
              SITE="app.agendasuper.com.br"
              ;;
            "rendarecorrente")
              APPNAME="APP Afiliado"
              IDAFILIADOAPP="3"
              SITE="painel.rendarecorrente.app"
              ;;
          esac

          echo "🛠️ Aplicando personalizações para $APPNAME"
          sed -i "s/NomePageTitle/${APPNAME}/g" "${TEMP_DIR}/main.dart.js"
          sed -i "s/91234567890/${IDAFILIADOAPP}/g" "${TEMP_DIR}/main.dart.js"
          sed -i "s/const appVersion = \".*\";/const appVersion = \"${VERSION}\";/g" "${TEMP_DIR}/index.html"
          sed -i "s/91234567890/${IDAFILIADOAPP}/g" "${TEMP_DIR}/lib/app_state.dart"

          BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S')
          LOG_FILE="${TEMP_DIR}/${SITE}_${VERSION}.txt"
          echo "Versão: ${VERSION}" > "${LOG_FILE}"
          echo "Data: ${BUILD_DATE}" >> "${LOG_FILE}"
          echo "📄 Criado ${LOG_FILE}"

          echo "🔍 Trecho de verificação no main.dart.js:"
          grep -m 1 "${APPNAME}" "${TEMP_DIR}/main.dart.js" || true
          grep -m 1 "${APPID}" "${TEMP_DIR}/main.dart.js" || true

          # ✅ Exporta SITE para ser usado nos próximos passos
          echo "SITE=${SITE}" >> $GITHUB_ENV

      # 1️⃣1️⃣-A Criar cópia temporária dos arquivos originais
      - name: 🗂️ Fazer backup dos arquivos originais (antes do custom_code)
        run: |
          echo "🧩 Criando backup temporário dos arquivos originais..."
          mkdir -p backup_original_actions
          cp -r lib/custom_code/actions/* backup_original_actions/ || true
          echo "✅ Backup dos arquivos originais concluído."


      # 1️⃣1️⃣-B Substituir arquivos customizados apenas para o build APK
      - name: 🔁 Aplicar custom_codes para build Android
        run: |
          echo "🧩 Aplicando arquivos personalizados de .github/overlays/custom_codes..."
          rsync -av --exclude ".git" ".github/overlays/custom_codes/" "lib/custom_code/actions/"
          echo "✅ Arquivos customizados aplicados com sucesso!"


      # 1️⃣1️⃣-B2 Instalar Flutter para build Android
      - name: 🧰 Instalar Flutter (para gerar APK)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

          
      # 1️⃣1️⃣-B3 Personalizar nome, ícones e imagens do APK
      - name: 🧠 Personalizar nome, ícones e imagens do APK
        run: |
          echo "⚙️ Iniciando personalização do APK..."

          case "${{ matrix.target.name }}" in
            "agendasuper")
              APPNAME="Agenda Super"
              ICON_PATH=".github/overlays/icons/agendasuper"
              ASSETS_PATH=".github/overlays/icons/agendasuper/assets_images"
              ;;
            "rendarecorrente")
              APPNAME="APP Afiliado"
              ICON_PATH=".github/overlays/icons/rendarecorrente"
              ASSETS_PATH=".github/overlays/icons/rendarecorrente/assets_images"
              ;;
          esac

          echo "🧩 Atualizando nome do app Android para: ${APPNAME}"
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${APPNAME}\"/" android/app/src/main/AndroidManifest.xml

          echo "🖼️ Substituindo ícones de aplicativo..."
          for size in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$size
            if [ -f "${ICON_PATH}/ic_launcher.png" ]; then
              cp -f "${ICON_PATH}/ic_launcher.png" android/app/src/main/res/$size/ic_launcher.png
            fi
          done

          echo "📦 Substituindo imagens personalizadas em assets/images..."
          if [ -d "${ASSETS_PATH}" ]; then
            rsync -av --exclude ".git" "${ASSETS_PATH}/" "assets/images/"
            echo "✅ Imagens personalizadas aplicadas com sucesso!"
          else
            echo "⚠️ Nenhuma pasta personalizada encontrada em ${ASSETS_PATH}, pulando..."
          fi

          echo "✅ Nome, ícones e imagens personalizadas aplicadas com sucesso!"

      # 1️⃣1️⃣-B4 Personalizar applicationId (único para cada app Android)
      - name: 🧱 Ajustar applicationId exclusivo
        run: |
          echo "⚙️ Ajustando applicationId..."
          case "${{ matrix.target.name }}" in
            "agendasuper")
              APP_ID_ANDROID="com.adminagendasuper.app"
              ;;
            "rendarecorrente")
              APP_ID_ANDROID="com.adminrendarecorrente.app"
              ;;
          esac
          sed -i "s/applicationId \".*\"/applicationId \"${APP_ID_ANDROID}\"/" android/app/build.gradle
          echo "✅ applicationId atualizado para ${APP_ID_ANDROID}"


      # 1️⃣1️⃣-C Gerar o APK Android (modo release)
      - name: 🤖 Gerar APK Android (modo release)
        run: |
          echo "📱 Iniciando build APK..."
          flutter build apk --release
          echo "✅ APK gerado com sucesso!"
          ls -lh build/app/outputs/flutter-apk/


      # 1️⃣1️⃣-D Restaurar arquivos originais após gerar o APK
      - name: 🔙 Restaurar arquivos originais após build APK
        run: |
          echo "♻️ Restaurando arquivos originais em lib/custom_code/actions/..."
          rm -rf lib/custom_code/actions/*
          cp -r backup_original_actions/* lib/custom_code/actions/ || true
          echo "✅ Arquivos originais restaurados."


      # 1️⃣1️⃣-E Enviar o APK para a hospedagem Hostinger
      - name: ☁️ Enviar APK para Hostinger
        run: |
          VERSION=$(jq -r '.version' "temp/${{ matrix.target.name }}/version.json")
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          APK_REMOTE_PATH="apk/${{ matrix.target.name }}_${VERSION}.apk"

          echo "📤 Enviando ${APK_FILE} para public_html/${APK_REMOTE_PATH}..."
          lftp -u "${{ secrets[ matrix.target.ftp_user ] }}","${{ secrets[ matrix.target.ftp_pass ] }}" "ftp://${{ secrets[ matrix.target.ftp_server ] }}" -e "
            set ftp:ssl-allow no;
            mkdir -p ${{ secrets[ matrix.target.ftp_dir ] }}/apk;
            put ${APK_FILE} -o ${{ secrets[ matrix.target.ftp_dir ] }}/${APK_REMOTE_PATH};
            bye
          "
          echo "✅ APK enviado para Hostinger: /public_html/${APK_REMOTE_PATH}"          

      # 1️⃣2️⃣ Cria backup remoto dentro da hospedagem com número da versão
      - name: 💾 Criar backup remoto com versão atual
        run: |
          set -e
          echo "🧩 Lendo versão atual do version.json na hospedagem..."
          FTP_HOST="${{ secrets[ matrix.target.ftp_server ] }}"
          FTP_USER="${{ secrets[ matrix.target.ftp_user ] }}"
          FTP_PASS="${{ secrets[ matrix.target.ftp_pass ] }}"
          REMOTE_DIR="${{ secrets[ matrix.target.ftp_dir ] }}"

          # 1️⃣2️⃣.1 Baixa o version.json remoto
          curl -s -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$REMOTE_DIR/version.json" -o version_remote.json || echo "{}" > version_remote.json
          VERSION_REMOTE=$(jq -r '.version // "desconhecida"' version_remote.json)
          echo "📦 Versão detectada no servidor: ${VERSION_REMOTE}"

          # 1️⃣2️⃣.2 Gera nome da pasta de backup
          TIMESTAMP=$(date '+%Y_%m_%d_%H%M%S')
          BACKUP_DIR="backup_versao_${VERSION_REMOTE}_${TIMESTAMP}"
          echo "📁 Pasta de backup será: ${BACKUP_DIR}"

          # 1️⃣2️⃣.3 Baixa public_html (sem backup)
          echo "⬇️ Baixando public_html (sem /backup)..."
          rm -rf local_backup && mkdir -p local_backup
          lftp -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST" -e "
            set ftp:ssl-allow no;
            mirror --verbose --exclude-glob backup/ ${REMOTE_DIR}/ ./local_backup/;
            bye
          "

          # 1️⃣2️⃣.4 Envia cópia para /backup/
          echo "⬆️ Enviando cópia para a pasta de backup..."
          lftp -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST" -e "
            set ftp:ssl-allow no;
            mkdir -p ${REMOTE_DIR}/backup/${BACKUP_DIR};
            mirror --reverse --verbose ./local_backup/ ${REMOTE_DIR}/backup/${BACKUP_DIR}/;
            bye
          "

          echo "✅ Backup completo criado em ${REMOTE_DIR}/backup/${BACKUP_DIR}"

      # 1️⃣3️⃣ Faz o deploy via FTP (sem apagar tudo)
      - name: 🚀 Publicar via FTP (Hostinger)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          protocol: ftp
          port: 21
          timeout: 1200
          retries: 5
          local-dir: temp/${{ matrix.target.name }}/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
          dangerous-clean-slate: false       # mantém arquivos antigos
          sync-mode: update                  # substitui apenas os modificados
          log-level: verbose

      # 1️⃣4️⃣ Registra versão no Supabase
      - name: 💾 Registrar versão no Supabase
        if: success() || failure()
        run: |
          TEMP_DIR="temp/${{ matrix.target.name }}"
          VERSION=$(jq -r '.version' "${TEMP_DIR}/version.json")
          DESC="${{ github.event.head_commit.message }}"
          STATUS="${{ job.status }}"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi

          echo "📦 Enviando versão ${VERSION} para Supabase..."
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${VERSION}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"${STATUS}\"}"

      # 1️⃣5️⃣ Captura informações para o e-mail
      - name: 📨 Preparar informações para e-mail
        if: success() || failure()
        run: |
          TEMP_DIR="temp/${{ matrix.target.name }}"
          VERSION=$(jq -r '.version' "${TEMP_DIR}/version.json")
          DATA=$(date '+%d/%m/%Y %H:%M:%S')
          STATUS="${{ job.status }}"
          DESC="${{ github.event.head_commit.message }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "DATA=${DATA}" >> $GITHUB_ENV
          echo "STATUS=${STATUS}" >> $GITHUB_ENV
          echo "DESC=${DESC}" >> $GITHUB_ENV

      # 1️⃣6️⃣ Enviar e-mail de notificação
      - name: ✉️ Disparar e-mail de status do deploy
        if: success() || failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🚀 Atualização ${{ matrix.target.name }} ${{ env.STATUS }}"
          to: "hersoares12@gmail.com, contatoagendasuper@gmail.com, gerenciavendasdigitais2@gmail.com"
          from: "APP ${{ matrix.target.name }} ${{ env.VERSION }} ${{ env.STATUS }} nova versão disponível <${{ secrets.MAIL_USER }}>"
          body: |
            ✅ Deploy finalizado para APP ${{ matrix.target.name }}
            🌐 Versão: ${{ env.VERSION }}
            📝 Descrição: ${{ env.DESC }}
            📅 Data: ${{ env.DATA }}
            🌐 Aplicativo: APP ${{ matrix.target.name }}
            🌎 Site: ${{ env.SITE }}
            ⚙️ Status: ${{ env.STATUS }}


      # 1️⃣7️⃣ Finaliza e mostra status
      - name: ✅ Finalização do deploy
        run: echo "🎉 Deploy concluído com sucesso para ${{ matrix.target.name }}!"
