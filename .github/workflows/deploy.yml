# 🌐 Build & Deploy (2 Sites)
name: 🌐 Build & Deploy (2 Sites)

on:
  push:
    branches:
      - flutterflow   # ajuste se o FlutterFlow usar outra branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona o repositório
      - name: 📥 Clonar código do repositório
        uses: actions/checkout@v4

      # 2️⃣ Instala o Flutter (versão estável compatível com FlutterFlow)
      - name: 🧰 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      # 3️⃣ Limpa cache e instala dependências
      - name: 🧹 Preparar ambiente Flutter limpo
        run: |
          flutter clean
          flutter pub get
          flutter --version
          dart --version

      # 4️⃣ Armazena build como artifact
      - name: 📦 Armazenar build base (sem compilar ainda)
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - name: agendasuper
            overlay: .github/overlays/agendasuper
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir:  FTP_DIR_ADMIN

          - name: rendarecorrente
            overlay: .github/overlays/rendarecorrente
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir:  FTP_DIR_AFI

    steps:
      # 5️⃣ Baixa o código-fonte
      - name: 📥 Recuperar código-fonte
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: .

      # 6️⃣ Instala dependências básicas
      - name: ⚙️ Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync curl lftp

      # 7️⃣ Define variáveis globais (nome, site, id afiliado)
      - name: 🌎 Definir variáveis globais do app
        run: |
          case "${{ matrix.target.name }}" in
            "agendasuper")
              APPNAME="Agenda Super"
              IDAFILIADOAPP="1"
              SITE="app.agendasuper.com.br"
              APP_ID_ANDROID="com.adminagendasuper.app"
              ;;
            "rendarecorrente")
              APPNAME="APP Afiliado"
              IDAFILIADOAPP="3"
              SITE="painel.rendarecorrente.app"
              APP_ID_ANDROID="com.adminrendarecorrente.app"
              ;;
          esac
          echo "APPNAME=$APPNAME" >> $GITHUB_ENV
          echo "SITE=$SITE" >> $GITHUB_ENV
          echo "IDAFILIADOAPP=$IDAFILIADOAPP" >> $GITHUB_ENV
          echo "APP_ID_ANDROID=$APP_ID_ANDROID" >> $GITHUB_ENV

      # 8️⃣ Editar arquivos principais (antes dos builds)
      - name: 🧠 Personalizar lib/app_state.dart e lib/main.dart
        run: |
          echo "⚙️ Aplicando personalizações iniciais..."
          perl -pi -e "s/91234567890/${IDAFILIADOAPP}/g" lib/app_state.dart
          perl -pi -e "s/NomePageTitle/${APPNAME}/g" lib/main.dart
          echo "✅ Arquivos personalizados antes do build"

      # 9️⃣ Instalar Flutter
      - name: 🧰 Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      # 🔟 Build Web
      - name: 🏗️ Build Web (modo release)
        run: |
          echo "🚀 Iniciando build Web..."
          flutter build web --release

      # 1️⃣1️⃣ Deploy Web via FTP
      - name: 🚀 Publicar Web via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          protocol: ftp
          port: 21
          local-dir: build/web/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
          timeout: 1200
          retries: 5
          sync-mode: update
          dangerous-clean-slate: false

      # 1️⃣2️⃣ Registrar versão WEB no Supabase
      - name: 💾 Registrar versão WEB no Supabase
        run: |
          VERSION=$(jq -r '.version' build/web/version.json)
          DESC="${{ github.event.head_commit.message }}"
          STATUS="success"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi

          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${VERSION}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"${STATUS}\", \"sistema_op\": \"WEB\"}"

      # 1️⃣3️⃣ Configurar keystore para assinatura do APK
      - name: 🔐 Configurar assinatura Android (keystore)
        run: |
          set -e
          echo "🔐 Gerando key.properties e configurando assinatura..."

          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

          echo "✅ key.properties criado com sucesso"

          if ! grep -q "key.properties" android/app/build.gradle; then
            echo "🧩 Adicionando configuração de assinatura ao build.gradle..."
            cat <<'GRAD' >> android/app/build.gradle

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("android/key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
GRAD
          fi

      # 1️⃣4️⃣ Aplicar ícones e applicationId
      - name: 🧱 Aplicar ícones e ID Android
        run: |
          ICON_PATH=".github/overlays/icons/${{ matrix.target.name }}"
          echo "🧩 Substituindo ícones de aplicativo..."
          for size in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$size
            if [ -f "${ICON_PATH}/ic_launcher.png" ]; then
              cp -f "${ICON_PATH}/ic_launcher.png" android/app/src/main/res/$size/ic_launcher.png
            fi
          done
          sed -i "s/applicationId \".*\"/applicationId \"${APP_ID_ANDROID}\"/" android/app/build.gradle
          echo "✅ Ícones e applicationId aplicados!"

      # 1️⃣5️⃣ Build APK
      - name: 🤖 Build APK (modo release)
        run: |
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/

      # 1️⃣6️⃣ Upload APK via FTP
      - name: ☁️ Enviar APK para Hostinger
        run: |
          VERSION=$(jq -r '.version' build/web/version.json)
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          APK_REMOTE_PATH="apk/${{ matrix.target.name }}_${VERSION}.apk"

          lftp -u "${{ secrets[ matrix.target.ftp_user ] }}","${{ secrets[ matrix.target.ftp_pass ] }}" "ftp://${{ secrets[ matrix.target.ftp_server ] }}" -e "
            set ftp:ssl-allow no;
            mkdir -p ${{ secrets[ matrix.target.ftp_dir ] }}/apk;
            put ${APK_FILE} -o ${{ secrets[ matrix.target.ftp_dir ] }}/${APK_REMOTE_PATH};
            bye
          "
          echo "✅ APK enviado com sucesso!"

      # 1️⃣7️⃣ Registrar versão APK no Supabase
      - name: 💾 Registrar versão APK no Supabase
        run: |
          VERSION=$(jq -r '.version' build/web/version.json)
          DESC="${{ github.event.head_commit.message }}"
          STATUS="success"
          APP_ID=0
          if [[ "${{ matrix.target.name }}" == "agendasuper" ]]; then APP_ID=2; fi
          if [[ "${{ matrix.target.name }}" == "rendarecorrente" ]]; then APP_ID=3; fi

          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/tbl_versoes_sistema" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"versao\": \"${VERSION}\", \"descricao\": \"${DESC}\", \"id_app\": ${APP_ID}, \"status\": \"${STATUS}\", \"sistema_op\": \"APK\"}"

      # 1️⃣8️⃣ Enviar e-mail de notificação final
      - name: ✉️ Notificar conclusão
        if: success() || failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🚀 Deploy completo ${{ matrix.target.name }} finalizado"
          to: "hersoares12@gmail.com, contatoagendasuper@gmail.com, gerenciavendasdigitais2@gmail.com"
          from: "Deploy Automático <${{ secrets.MAIL_USER }}>"
          body: |
            ✅ Deploy finalizado com sucesso!
            📦 Aplicativo: ${{ env.APPNAME }}
            🌐 Site: ${{ env.SITE }}
            ⚙️ Versão: $(jq -r '.version' build/web/version.json)
            📅 Data: $(date '+%d/%m/%Y %H:%M:%S')
            🔧 Sistema: WEB + APK
            🚀 Status: ${{ job.status }}
