<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Agenda Super Admin">

  

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" href="1432676_Admin.png" sizes="any"/>
  

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Agenda Super - Admin" />
  <meta property="og:description" content="Gerencie os agendamentos de sua empresa. Facilidade para seus clientes e controle para sua emprea." />
  <meta property="og:image" content="/assets/assets/images/1432676_Admin.png" /> 
  <meta name="twitter:title" content="Agenda Super - Admin" />
  <meta name="twitter:description" content="Gerencie os agendamentos de sua empresa. Facilidade para seus clientes e controle para sua emprea." />
  <meta name="twitter:image" content="/assets/assets/images/1432676_Admin.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> Agenda Super - Admin </title>
  <meta name="description" content="Gerencie os agendamentos de sua empresa. Facilidade para seus clientes e controle para sua emprea." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#14181b">

  <link rel="manifest" href="manifest.json">

  <!-- OneSignal Web Push SDK v16 -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "5438416a-02cf-4ff7-901c-1df6362ca882",
        notifyButton: { enable: true },
        allowLocalhostAsSecureOrigin: true
      });
    });
  </script>
  
  
</head>
<body>
  
  
  
  
  
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
